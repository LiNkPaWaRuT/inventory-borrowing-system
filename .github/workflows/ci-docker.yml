# ##############################################################################
# CI — "CI & Docker Build"
# ##############################################################################
# WHAT THIS WORKFLOW DOES
#   Runs the project's checks and is used in two ways:
#     1) directly on every pull request to `main` and `staging` (and manually), and
#     2) as a REUSABLE workflow called by deploy.yml (`workflow_call`) so the
#        deploy only starts after these checks pass.
#   Steps: offline deploy-script tests -> database migration & seed -> Vitest suite
#          -> frontend + backend build -> verify the production Dockerfile builds.
#   It does NOT deploy anything.
#
# ⚠️ DO NOT RENAME (the lab guide refers to these names):
#   - job id : test-and-docker
#   - deploy.yml uses `environment: demo` and the 4 variables GCP_PROJECT_ID,
#     GCP_REGION, WIF_PROVIDER, WIF_SERVICE_ACCOUNT — keep those names too.
# ##############################################################################

name: CI & Docker Build

# ------------------------------------------------------------------------------
# Triggers
#   workflow_call     : lets deploy.yml reuse this workflow (do not remove).
#   pull_request      : checks every PR targeting main or staging before merge.
#   workflow_dispatch : manual "Run workflow" button.
# ------------------------------------------------------------------------------
on:
  workflow_call:
  pull_request:
    branches: [main, staging]
  workflow_dispatch:

# Least privilege: this workflow only needs to read the repository.
permissions:
  contents: read

# A newer run on the same ref cancels the older one (saves minutes).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ⚠️ Job id must stay `test-and-docker`.
  test-and-docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # --------------------------------------------------------------------------
    # Temporary PostgreSQL service container available for database integration.
    # --------------------------------------------------------------------------
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: toktickit
          POSTGRES_PASSWORD: toktickit
          POSTGRES_DB: toktickit
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      # ------------------------------------------------------------------------
      # 1. Get the source code
      # ------------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # ------------------------------------------------------------------------
      # 2. Language runtimes
      # ------------------------------------------------------------------------
      - name: Setup Node.js 20
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
          cache: "npm"

      - name: Setup Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      # ------------------------------------------------------------------------
      # 3. Deploy scripts: syntax check + offline tests (NO access to GCP)
      # ------------------------------------------------------------------------
      - name: Check deployment scripts without accessing GCP
        run: |
          bash -n deploy/deploy.sh deploy/teardown.sh deploy/release.sh
          bash deploy/tests/test_deploy_stub.sh
          bash deploy/tests/test_release_stub.sh
          python3 -m unittest discover -s deploy/tests -p 'test_smoke.py'

      # ------------------------------------------------------------------------
      # 4. Application: install -> generate prisma -> migrate -> seed -> test
      # ------------------------------------------------------------------------
      - name: Install dependencies
        run: npm ci

      - name: Setup Database & Run Tests (Prisma + Vitest)
        env:
          DATABASE_URL: file:./prisma/dev.db
          JWT_SECRET: cpe334-ci-test-jwt-secret-2026
          NODE_ENV: test
        run: |
          npx prisma generate
          npx prisma migrate deploy
          npm run db:seed
          npm test

      # ------------------------------------------------------------------------
      # 5. Build application (TypeScript compilation + Vite frontend bundle)
      # ------------------------------------------------------------------------
      - name: Build Application (TypeScript + Vite)
        run: npm run build

      # ------------------------------------------------------------------------
      # 6. Verify production Docker build
      # ------------------------------------------------------------------------
      - name: Verify Unified Production Dockerfile Build
        run: docker build -t inventory-borrowing-system:latest .
